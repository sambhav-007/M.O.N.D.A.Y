[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "monday-ai"
version = "1.0.0"
description = "Project M.O.N.D.A.Y. — Multi-modal Autonomous Network & Desktop Assistant System"
authors = [
    { name = "Siddhant Bhatia" },
    { name = "Sambhav Sehgal" },
    { name = "Samarth Sharma" },
    { name = "Shivansh Chandel" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "rich>=13.0.0",
    "joblib>=1.3.0",
    "matplotlib>=3.7.0"
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.coverage.run]
source = ["core", "ml", "agents", "api"]
