[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default run is offline and deterministic:
#   --block-network   a stray socket call fails loudly instead of making the
#                     result depend on the network
#   -m "not network"  tests that genuinely need live third-party APIs are
#                     opt-in; run them with `pytest -m network`
# Everything HTTP-dependent in the default selection replays a cassette from
# tests/cassettes/ — see tests/conftest.py.
# `testserver` is FastAPI TestClient's in-process ASGI host — no socket leaves
# the process, so blocking it would only break tests that have no external
# dependency at all. localhost is allowed for the same reason.
addopts = --block-network --allowed-hosts=testserver,localhost,127\.0\.0\.1,::1 -m "not network"

markers =
    network: needs live internet access; deselected by default
    vcr: replays recorded HTTP from tests/cassettes/ (pytest-recording)

filterwarnings =
    ignore::DeprecationWarning
    ignore::ResourceWarning
